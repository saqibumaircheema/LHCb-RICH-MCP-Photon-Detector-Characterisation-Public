<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470">
<rect width="1100" height="470" fill="white"/>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#4b5563}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.h{font-size:23px;font-weight:700}.v{font-size:32px;font-weight:700;fill:#1f4e79}.s{font-size:16px;fill:#4b5563}.warn{font-size:15px;fill:#6b7280}</style>
<text x="60" y="55" class="t title">Selected spatial-response results</text>
<text x="60" y="86" class="t sub">Effective Gaussian broadening from the tested detector/readout configurations</text>
<rect x="60" y="135" width="465" height="240" rx="14" class="card"/><text x="92" y="180" class="t h">LAPPD — nominal bias</text><text x="92" y="238" class="t v">σ_eff = 4.781 ± 0.025 mm</text><text x="92" y="282" class="t s">2.9 mm external pickup</text><text x="92" y="311" class="t s">0.900 mm measured focused-laser width</text><text x="92" y="340" class="t s">capacitive readout</text>
<rect x="575" y="135" width="465" height="240" rx="14" class="card"/><text x="607" y="180" class="t h">HRPPD — channel 52</text><text x="607" y="238" class="t v">σ_eff = 1.538 ± 0.003 mm</text><text x="607" y="282" class="t s">3.0 mm pixel width</text><text x="607" y="311" class="t s">5.173 mm measured collimated-laser width</text><text x="607" y="340" class="t s">direct pixelated anode</text>
<text x="60" y="420" class="t warn">The two values were obtained under different illumination and readout conditions and are not a ranking of intrinsic detector resolution.</text>
</svg>