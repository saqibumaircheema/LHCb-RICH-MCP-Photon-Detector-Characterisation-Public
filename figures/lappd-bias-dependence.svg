<line x1="110" y1="440" x2="900" y2="440" class="grid"/><line x1="110" y1="350" x2="900" y2="350" class="grid"/><line x1="110" y1="260" x2="900" y2="260" class="grid"/><line x1="110" y1="170" x2="900" y2="170" class="grid"/>
<text x="60" y="506" class="t tick">4.4</text><text x="60" y="446" class="t tick">4.6</text><text x="60" y="356" class="t tick">4.9</text><text x="60" y="266" class="t tick">5.2</text><text x="60" y="176" class="t tick">5.5</text>
