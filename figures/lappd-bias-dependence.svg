<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="white"/>
<style>
.t{font-family:Arial,Helvetica,sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#4b5563}
.ax{stroke:#111827;stroke-width:2}.grid{stroke:#e5e7eb;stroke-width:1}.line{stroke:#1f4e79;stroke-width:4;fill:none}.pt{fill:#1f4e79}
.err{stroke:#1f4e79;stroke-width:2}.lab{font-size:18px}.tick{font-size:15px;fill:#4b5563}.note{font-size:15px;fill:#6b7280}
</style>
<text x="70" y="55" class="t title">LAPPD effective spatial broadening vs common gap bias</text>
<text x="70" y="86" class="t sub">Measured position-scan fit parameter; MCP1–MCP2 and MCP2–anode gaps varied together</text>
